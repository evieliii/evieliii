<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Evie — HR × AI Builder</title>
  <desc id="desc">A warm cream and amber profile banner for Evie.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.56" stop-color="#f9ead5"/>
      <stop offset="1" stop-color="#efc49b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbd66"/>
      <stop offset="1" stop-color="#d86f45"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="1080" cy="70" r="150" fill="#e48a5f" opacity=".18" filter="url(#soft)"/>
  <circle cx="980" cy="305" r="170" fill="#f6bc73" opacity=".22" filter="url(#soft)"/>

  <g opacity=".55" fill="none" stroke="#b86c4b" stroke-width="1.4">
    <path d="M760 0v360M820 0v360M880 0v360M940 0v360M1000 0v360M1060 0v360M1120 0v360M1180 0v360"/>
    <path d="M720 60h480M720 120h480M720 180h480M720 240h480M720 300h480"/>
  </g>

  <g transform="translate(92 72)">
    <rect width="104" height="104" rx="30" fill="#2f2927"/>
    <path d="M28 72c18-5 27-22 31-48 8 21 18 37 31 48-19 15-43 15-62 0Z" fill="url(#sun)"/>
    <circle cx="52" cy="48" r="9" fill="#fff8ed"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="230" y="125" fill="#2f2927" font-size="62" font-weight="800" letter-spacing="1">EVIE</text>
    <text x="232" y="176" fill="#925438" font-size="25" font-weight="650" letter-spacing="2">HR × AI BUILDER</text>
    <text x="232" y="231" fill="#554a45" font-size="23" font-weight="450">Learn in public · Build in public</text>
    <text x="232" y="273" fill="#7d6b62" font-size="18">把每一次学习，变成一个真实可用的作品。</text>
  </g>

  <g transform="translate(973 136)" fill="none" stroke="#2f2927" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 48c34-48 74-48 108 0-34 48-74 48-108 0Z" stroke-width="7"/>
    <circle cx="54" cy="48" r="18" fill="url(#sun)" stroke-width="7"/>
    <path d="M54 0v-20M12 17-3 2M96 17l15-15M12 79-3 94M96 79l15 15" stroke-width="6"/>
  </g>

  <g fill="#c97850">
    <path d="M721 74l5 13 13 5-13 5-5 13-5-13-13-5 13-5Z"/>
    <path d="M850 286l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/>
    <circle cx="770" cy="306" r="5"/>
    <circle cx="1130" cy="238" r="6"/>
